{% extends "base.html" %}

{% block title %}
    Мои заметки
{% endblock %}

{% block content %}

<h2 class="mb-4">Список заметок пользователя {{ current_user.username }}</h2>
<div class="list-group">
    {% for note in notes %}
    <div class="list-group-item list-group-item-action">
        <div class="d-flex w-100 justify-content-between align-items-center">
            
            <div>
                <h5 class="mb-1">
                    {{ note.title }}
                </h5>
                <p class="mb-1">
                    {{ note.text }}
                </p>
            </div>

            <a href="/notes/{{ note.id }}" class="btn btn-primary">
                Подробнее
            </a>
        </div>
    </div>
    {% endfor %}
</div>
{% endblock %}
