{% extends "base.html" %}

{% block title %}
    {{ note.title }}
{% endblock %}

{% block content %}

<div class="container mt-4">
    <div class="card">
        <div class="card-body">
            
            <h2 class="card-title mb-3">
                {{ note.title }}
            </h2>
            <div class="d-flex gap-2">

                <a href="/notes/{{ note.id }}/edit" class="btn btn-primary">
                    Редактировать
                </a>

                <button type="button" class="btn btn-danger" data-bs-toggle="modal" data-bs-target="#deleteModal">
                    Удалить заметку
                </button>

                <a href="/notes/" class="btn btn-outline-secondary">
                    К списку заметок
                </a>

            </div>
            <div class="row">
                <div class="col">
                    <p class="card-text">
                        {{ note.text }}
                    </p>
                </div>
                <div class="col">
                    {% if note.image %}
                        <div class="mb-4">
                            <img src="/notes/{{ note.id }}/image" alt="Изображение заметки" class="img-fluid rounded" style="max-width: 200px;">
                        </div>
                    {% endif %}
                </div>
            </div>

        </div>
    </div>
</div>

<div class="modal fade" id="deleteModal" tabindex="-1" aria-labelledby="deleteModalLabel" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">

            <div class="modal-header">
                <h5 class="modal-title" id="deleteModalLabel">
                    Удаление заметки
                </h5>

                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Закрыть"></button>
            </div>

            <div class="modal-body">
                Вы уверены, что хотите удалить эту заметку?
            </div>

            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">
                    Отмена
                </button>

                <form method="post" action="/notes/{{ note.id }}/delete">
                    <button type="submit" class="btn btn-danger">
                        Удалить
                    </button>
                </form>
            </div>

        </div>
    </div>
</div>

{% endblock %}
